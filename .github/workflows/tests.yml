name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # Sin pantalla ni sonido: la prueba de humo juega partidas "a ciegas"
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Estilo (ruff)
        run: ruff check .
      - name: Tipos (mypy)
        run: mypy
      - name: Tests (lógica + partida completa sin ventana)
        run: python -m unittest discover -s tests -v
