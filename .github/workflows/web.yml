name: Versión web

# Publica el juego en GitHub Pages para jugarlo desde el navegador.
# Requiere activar Pages una vez: Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar pygbag
        run: pip install pygbag
      - name: Preparar solo los archivos del juego
        run: |
          mkdir meteoroshooter
          cp -r main.py meteoro assets meteoroshooter/
      - name: Construir la versión web
        run: python -m pygbag --build --title "Meteoro Shooter" meteoroshooter
      - uses: actions/upload-pages-artifact@v3
        with:
          path: meteoroshooter/build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
