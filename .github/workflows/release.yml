name: Publicar ejecutables

# Se ejecuta al subir una etiqueta de versión (por ejemplo: git tag v1.1 && git push origin v1.1)
# o a mano desde la pestaña "Actions" de GitHub.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: MeteoroShooter-windows
            sep: ";"
          - os: macos-latest
            name: MeteoroShooter-macos
            sep: ":"
          - os: ubuntu-latest
            name: MeteoroShooter-linux
            sep: ":"
    runs-on: ${{ matrix.os }}
    env:
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Tests
        run: python -m unittest discover -s tests
      - name: Crear el ejecutable
        run: pyinstaller --onefile --windowed --name MeteoroShooter --add-data "assets${{ matrix.sep }}assets" shooter.py
      - name: Empaquetar (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/MeteoroShooter.exe -DestinationPath ${{ matrix.name }}.zip
      - name: Empaquetar (macOS)
        if: runner.os == 'macOS'
        run: cd dist && zip -r ../${{ matrix.name }}.zip MeteoroShooter.app
      - name: Empaquetar (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.name }}.tar.gz -C dist MeteoroShooter
      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}.*
      - name: Adjuntar a la versión (release)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.name }}.*
